async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlock() {
  const html = new TextDecoder().decode(
    Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0)));
  document.open();
  document.write(html);
  document.close();
}

if (sessionStorage.getItem('stepoCrm.unlocked') === '1') {
  unlock();
} else {
  const pass = document.getElementById('pass');
  const err = document.getElementById('err');
  // Submit via the form, not a keydown listener: this fires for the button tap,
  // a desktop Enter press, AND a mobile keyboard's Go/Return. The old
  // Enter-keydown-only path could not be triggered on a mobile numeric keypad,
  // which has no Enter key — so the passcode could never be entered on a phone.
  document.getElementById('gate').addEventListener('submit', async e => {
    e.preventDefault();
    if (await sha256(pass.value) === HASH) {
      sessionStorage.setItem('stepoCrm.unlocked', '1');
      unlock();
    } else {
      err.textContent = 'Nope.';
      pass.value = '';
      pass.focus();
    }
  });
}
</script>
