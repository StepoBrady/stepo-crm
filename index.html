<style>/* Brand tokens. Lime is the only accent; no other green appears anywhere. */
:root {
  --bg: #000000;
  --surface: #0E0E0E;
  --surface-2: #171717;
  --line: #2A2A2A;
  --ink: #FFFFFF;
  --ink-dim: #9A9A9A;
  --accent: #D4FF3F;
  --danger: #FF4D4D;
  --warn: #FFB020;
  --radius: 10px;
  --gap: 16px;
  --font-display: 'Big Shoulders Display', system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
}

h1, h2, h3, .brand, .stage-head, .metric-value {
  font-family: var(--font-display);
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  margin: 0;
}

.topbar {
  display: flex; align-items: center; gap: var(--gap);
  padding: 12px 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg); z-index: 20;
}
.brand { font-size: 26px; letter-spacing: 0.04em; }
.brand .accent { color: var(--accent); }
.nav { display: flex; gap: 4px; margin-left: 16px; }
.nav a {
  color: var(--ink-dim); text-decoration: none; padding: 6px 12px;
  border-radius: var(--radius); font-weight: 600;
}
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a.active { color: var(--bg); background: var(--accent); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

.btn {
  font: inherit; font-weight: 600; cursor: pointer;
  border-radius: var(--radius); padding: 7px 14px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn-accent { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn-ghost { background: transparent; }
.btn-danger { color: var(--danger); }

.sync-status { font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.sync-status.state-synced::before { content: '● '; color: var(--accent); }
.sync-status.state-syncing::before { content: '◌ '; color: var(--warn); }
.sync-status.state-offline::before,
.sync-status.state-unauthorized::before,
.sync-status.state-error::before,
.sync-status.state-unparseable::before { content: '● '; color: var(--danger); }

.banner {
  padding: 10px 20px; background: var(--surface-2);
  border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: center;
}
.banner.danger { border-left: 3px solid var(--danger); }
.banner.warn { border-left: 3px solid var(--warn); }

main { padding: 20px 24px; max-width: 2200px; margin: 0 auto; }

/* Magic-link sign-in screen (full-screen, shown when signed out). */
.signin {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  background: var(--bg); padding: 24px;
}
.signin-box {
  width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px; text-align: center;
}
.signin-form { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
.signin-form input { text-align: center; }
.signin-msg { min-height: 18px; font-size: 12px; color: var(--ink-dim); }
.signin-msg.err { color: var(--danger); }
.signin-msg.ok { color: var(--accent); }
.user-chip { display: flex; align-items: center; gap: 8px; }

/* Today: the follow-up sections tile across the width on desktop (a daily
   dashboard), and collapse to a single column on mobile. */
main[data-route="today"] {
  display: grid; align-items: start; gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(560px, 1fr));
}
main[data-route="today"] > h1 { grid-column: 1 / -1; margin-bottom: -6px; }
main[data-route="today"] > .section { margin-bottom: 0; }

/* Learnings tab tiles the theme sections across the width, like Today. */
main[data-route="learnings"] {
  display: grid; align-items: start; gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
}
main[data-route="learnings"] > h1,
main[data-route="learnings"] > .muted { grid-column: 1 / -1; margin-bottom: 0; }
main[data-route="learnings"] > .section { margin-bottom: 0; }

/* Account detail: management (deals + contacts) on the left, activity stream
   on the right. Stacks below 900px. */
.detail-cols {
  display: grid; align-items: start; gap: 24px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
}
.detail-cols > * { min-width: 0; }
.detail-cols .section:last-child { margin-bottom: 0; }

/* Accounts: a card grid rather than one narrow column. */
.card-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.card-grid .row { margin-bottom: 0; height: 100%; }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px;
}
.section { margin-bottom: 28px; }
.section-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line);
}
.section-head h2 { font-size: 20px; }
.count { color: var(--ink-dim); font-size: 12px; }
.empty { color: var(--ink-dim); padding: 18px; text-align: center; }

.row {
  display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); margin-bottom: 8px;
}
.row:hover { border-color: var(--accent); }
.row .grow { flex: 1; min-width: 0; }
/* Standalone, not `.row .muted` — the drawer and account detail both use it
   outside any .row, where a descendant selector would silently not apply. */
.muted { color: var(--ink-dim); font-size: 12px; }

.chip {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-dim); white-space: nowrap;
}
.chip.overdue { background: var(--danger); color: #fff; }
.chip.today { background: var(--accent); color: var(--bg); }
.chip.cold { background: var(--warn); color: var(--bg); }
.chip.calendar { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); }
.chip.owe { background: var(--danger); color: #fff; }
.chip.theme { background: var(--surface-2); color: var(--accent); border: 1px solid var(--line); white-space: normal; }
.learning-text { font-size: 13px; margin-top: 2px; }
.learnings-reminder { margin-bottom: 16px; border-left: 3px solid var(--accent); }
.learnings-reminder .learning-text { color: var(--ink); margin-top: 4px; }
.notes { margin-top: 4px; }
.notes summary { cursor: pointer; color: var(--accent); font-size: 12px; }
.notes-body { white-space: pre-wrap; color: var(--ink-dim); font-size: 13px; margin-top: 6px;
              border-left: 2px solid var(--line); padding-left: 10px; }

.metrics { display: flex; gap: 28px; margin-bottom: 18px; }
.metric-label { color: var(--ink-dim); font-size: 11px; text-transform: uppercase; }
.metric-value { font-size: 30px; color: var(--accent); }

.board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.column {
  flex: 1 1 0; min-width: 150px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 10px; min-height: 120px;
}
.column.drop-target { border-color: var(--accent); }
.stage-head { font-size: 15px; display: flex; justify-content: space-between; margin-bottom: 8px; }
.stage-head .sum { color: var(--accent); }
.deal-card {

<script>
(function(){
'use strict';
/* ===== js/config.js ===== */
/* Public Supabase config. The publishable (anon) key is meant to live in the
   client — Row-Level Security in the database is what protects the data, not
   the secrecy of this key. No secret (service_role) key ever appears here. */
const SUPABASE_URL = 'https://onmaphxyqrweavpcrimx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6nucOAORqPLMWZxFQQuiuA_6xcXohPC';


/* ===== js/model.js ===== */
/* Schema constants, record factories, and pure derived calculations.
   No I/O. No implicit clock — every function that needs "now" takes it. */

const SCHEMA_VERSION = 1;

const STAGES = [
  { id: 'lead',        label: 'Lead',        probability: 0.05, isClosed: false, isWon: false },
  { id: 'contacted',   label: 'Contacted',   probability: 0.10, isClosed: false, isWon: false },
  { id: 'discovery',   label: 'Discovery',   probability: 0.25, isClosed: false, isWon: false },
  { id: 'demo',        label: 'Demo',        probability: 0.40, isClosed: false, isWon: false },
  { id: 'proposal',    label: 'Proposal',    probability: 0.60, isClosed: false, isWon: false },
  { id: 'negotiation', label: 'Negotiation', probability: 0.80, isClosed: false, isWon: false },
  { id: 'closed_won',  label: 'Closed Won',  probability: 1.00, isClosed: true,  isWon: true  },
  { id: 'closed_lost', label: 'Closed Lost', probability: 0.00, isClosed: true,  isWon: false },
];

const STAGE_IDS = STAGES.map(s => s.id);

/* A deal lives on one of three tracks. 'pipeline' uses STAGES (the sales
   funnel); 'pilot' uses PILOT_STAGES (post-sale trial); 'backburner' is a
   keep-warm list with no stages. */
const TRACKS = ['pipeline', 'pilot', 'backburner'];

const PILOT_STAGES = [
  { id: 'kickoff',    label: 'Kickoff',    probability: 0.70 },
  { id: 'onboarding', label: 'Onboarding', probability: 0.78 },
  { id: 'active',     label: 'Active',     probability: 0.85 },
  { id: 'evaluation', label: 'Evaluation', probability: 0.90 },
  { id: 'converting', label: 'Converting', probability: 0.95 },
];
const PILOT_STAGE_IDS = PILOT_STAGES.map(s => s.id);
function pilotStageById(id) {
  return PILOT_STAGES.find(s => s.id === id);
}

const ACCOUNT_TYPES = ['carrier', 'broker', 'contractor', 'other'];
const INTERACTION_TYPES = ['call', 'meeting', 'email', 'sent', 'note'];

/* Learning themes double as the "overarching learnings" shown at the top of the
   Learnings tab; each per-account learning is tagged with one so specifics roll
   up under the theme. The first three are the insurance-industry themes. */
const LEARNING_THEMES = [
  { id: 'report_time',      label: 'Save report-writing time' },
  { id: 'differentiation',  label: 'Differentiated service to retain clients' },
  { id: 'underwriter_risk', label: 'Risk services that speak to the underwriter' },
  { id: 'inspection_docs',  label: 'Inspection documentation & corrective actions' },
  { id: 'adoption',         label: 'Adoption & ease of use' },
  { id: 'other',            label: 'Other' },
];
const LEARNING_THEME_IDS = LEARNING_THEMES.map(t => t.id);
function learningThemeById(id) {
  return LEARNING_THEMES.find(t => t.id === id);
}

function newId() {
  if (globalThis.crypto && typeof globalThis.crypto.randomUUID === 'function') {
    return globalThis.crypto.randomUUID();
  }
  return 'id-' + Math.random().toString(36).slice(2) + '-' + (idCounter += 1);
}
let idCounter = 0;

function emptyDoc() {
  return { version: SCHEMA_VERSION, accounts: [], contacts: [], deals: [], interactions: [] };
}

function baseRecord(now) {
  return {
    id: newId(),
    createdAt: now,
    updatedAt: now,
    deletedAt: null,
    source: 'manual',
    externalId: null,
    syncedAt: null,
  };
}

/* Only keys listed here are accepted from `fields`; anything else is dropped
   so a malformed importer cannot smuggle junk into the document. */
const PROVENANCE_KEYS = ['source', 'externalId', 'syncedAt'];

function build(defaults, fields, allowed, now) {
  const rec = { ...baseRecord(now), ...defaults };
  for (const key of allowed.concat(PROVENANCE_KEYS)) {
    if (fields[key] !== undefined) rec[key] = fields[key];
  }
  return rec;
}

function makeAccount(fields, now) {
  return build(
    { name: '', type: 'other', website: '', notes: '' },
    fields, ['name', 'type', 'website', 'notes'], now,
  );
}

function makeContact(fields, now) {
  return build(
    { accountId: null, name: '', title: '', email: '', phone: '', linkedin: '', notes: '' },
    fields, ['accountId', 'name', 'title', 'email', 'phone', 'linkedin', 'notes'], now,
  );
}

function makeDeal(fields, now) {
  return build(
    {
      accountId: null, primaryContactId: null, name: '', track: 'pipeline',
      stage: 'lead', value: 0, probability: null, expectedCloseDate: null,
      nextAction: null, closedAt: null, closedReason: '',
    },
    fields,
    ['accountId', 'primaryContactId', 'name', 'track', 'stage', 'value',
     'probability', 'expectedCloseDate', 'nextAction', 'closedAt', 'closedReason'],
    now,
  );
}

function makeLearning(fields, now) {
  return build(
    { accountId: null, dealId: null, theme: 'other', text: '' },
    fields, ['accountId', 'dealId', 'theme', 'text'], now,
  );
}

function makeInteraction(fields, now) {
  return build(
    {
      accountId: null, dealId: null, contactIds: [], date: now.slice(0, 10),
      type: 'note', summary: '', artifactName: '', artifactUrl: '',
      direction: null, notes: '',
    },
    fields,
    ['accountId', 'dealId', 'contactIds', 'date', 'type',
     'summary', 'artifactName', 'artifactUrl', 'direction', 'notes'],
    now,
  );
}

function stageById(id) {
  return STAGES.find(s => s.id === id);
}

function effectiveProbability(deal) {
  if (typeof deal.probability === 'number') return deal.probability;
  const stage = stageById(deal.stage);
  return stage ? stage.probability : 0;
}

function isOpen(deal) {
  const stage = stageById(deal.stage);
  return !!stage && !stage.isClosed;
}

function weightedForecast(deals) {
  return deals.filter(isOpen)
    .reduce((sum, d) => sum + (d.value || 0) * effectiveProbability(d), 0);
}

function openPipelineValue(deals) {
  return deals.filter(isOpen).reduce((sum, d) => sum + (d.value || 0), 0);
}

/* Date-only strings are compared lexically, never parsed into a Date.
   Parsing "2026-07-24" yields UTC midnight, which reads as the previous
   day in any western timezone and silently marks today's work overdue. */
function addDays(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + days));
  return dt.toISOString().slice(0, 10);
}

function dueBucket(dueDate, today) {
  if (!dueDate) return 'none';
  if (dueDate < today) return 'overdue';
  if (dueDate === today) return 'today';
  return dueDate <= addDays(today, 7) ? 'week' : 'later';
}

function lastInteractionDate(interactions, dealId) {
  let latest = null;
  for (const i of interactions) {
    if (i.dealId !== dealId || i.deletedAt) continue;
    if (latest === null || i.date > latest) latest = i.date;
  }
  return latest;
}

function isGoingCold(deal, interactions, today, days = 21) {
  if (!isOpen(deal)) return false;
  const last = lastInteractionDate(interactions, deal.id);
  if (last === null) return true;
  return last < addDays(today, -days);
}

function latestEmail(interactions, pred) {
  let latest = null;
  for (const i of interactions) {
    if (i.type !== 'email' || i.deletedAt || !pred(i)) continue;
    if (!latest || i.date > latest.date) latest = i;
  }
  return latest;
}

function statusOf(latest) {
  if (!latest) return null;
  return {
    state: latest.direction === 'in' ? 'awaiting_you' : 'awaiting_them',
    since: latest.date,
    direction: latest.direction,
  };
}

function contactEmailStatus(interactions, contactId) {
  return statusOf(latestEmail(interactions, i => (i.contactIds || []).includes(contactId)));
}

function accountEmailStatus(interactions, accountId) {
  return statusOf(latestEmail(interactions, i => i.accountId === accountId));
}

function repliesOwed(interactions, contacts, accounts) {
  const acctById = new Map(accounts.filter(a => !a.deletedAt).map(a => [a.id, a]));
  const owed = [];
  for (const c of contacts) {
    if (c.deletedAt) continue;
    const st = contactEmailStatus(interactions, c.id);
    if (st && st.state === 'awaiting_you') {
      owed.push({ contact: c, account: acctById.get(c.accountId) || null, since: st.since });
    }
  }
  owed.sort((a, b) => (a.since < b.since ? 1 : -1));
  return owed;
}


/* ===== js/dom.js ===== */
/* Minimal DOM helpers. Deliberately not a framework — the app has one
   user and a handful of screens, and a render-on-change loop is enough. */

function el(tag, attrs = {}, children = []) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    // Guard first, so `class` and `text` get the same falsy-sentinel handling
    // as every other attribute. Without it, `class: cond && 'chip'` paints a
    // literal class="false". Note 0 and '' are deliberately still applied.
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k.startsWith('on') && typeof v === 'function') {
      node.addEventListener(k.slice(2).toLowerCase(), v);
    } else {
      node.setAttribute(k, v);
    }
  }
  // flat(Infinity): views routinely pass an array of rows as ONE entry of the
  // children array. Node.append() does not spread an array argument — it
  // coerces it to a string, rendering "[object HTMLDivElement],..." as text.
  for (const child of [].concat(children).flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    node.append(typeof child === 'string' ? document.createTextNode(child) : child);
  }
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

/* Every overlay (deal drawer, quick-add, search, connect) mounts into the one
   shared #overlay-root and binds its own window keydown handler. Opening one
   while another is up would orphan that handler: a later Escape would wipe an
   unrelated overlay, and a later Ctrl-Enter could fire a detached form's save.
   Each overlay registers its closer here and calls closeAllOverlays() before
   mounting, so exactly one overlay is ever live. */
const overlayClosers = new Set();

function registerOverlayCloser(fn) {
  overlayClosers.add(fn);
}

function closeAllOverlays() {
  for (const fn of overlayClosers) fn();
}

/* Returns the URL only if it is safe to put in an href, else null.
   The document is synced from a remote repo and Phase 2 will import URLs out
   of email, so a `javascript:` URI in a record must never become a clickable
   link running in this origin. Callers render no link when this returns null. */
function safeHref(url) {
  if (typeof url !== 'string') return null;
  const trimmed = url.trim();
  return /^(https?:|mailto:)/i.test(trimmed) ? trimmed : null;
}

function fmtMoney(n) {
  const value = Number(n) || 0;
  if (Math.abs(value) >= 1000) return '$' + Math.round(value / 1000) + 'k';
  return '$' + value.toLocaleString('en-US');
}

/* Date-only strings are formatted without ever constructing a local Date,
   for the same timezone reason as dueBucket. */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.slice(0, 10).split('-').map(Number);
  return `${MONTHS[m - 1]} ${d}, ${y}`;
}

function todayStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}


/* ===== js/db.js ===== */
/* Supabase-backed data layer. Exposes the SAME interface as the old
   localStorage store (load/list/get/add/update/remove/subscribe) so the views
   never change — but reads/writes go to Postgres, guarded by Row-Level
   Security, and teammates' changes stream in over Realtime.

   The Supabase client comes from the standalone UMD build loaded in index.html
   (window.supabase), because the app is bundled as a classic <script>, not an
   ES module, so a runtime `import` is not available. */

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

const FACTORIES = {
  accounts: makeAccount, contacts: makeContact, deals: makeDeal,
  interactions: makeInteraction, learnings: makeLearning,
};
const TABLES = Object.keys(FACTORIES);

let sessionUser = null;
function setSessionUser(u) { sessionUser = u; }

/* ── auth ─────────────────────────────────────────────────────────────── */
function sendMagicLink(email) {
  return supa.auth.signInWithOtp({
    email: email.trim().toLowerCase(),
    options: { emailRedirectTo: location.origin + location.pathname },
  });
}
function signOutUser() { return supa.auth.signOut(); }
function onAuthChange(cb) { return supa.auth.onAuthStateChange((_evt, session) => cb(session)); }
async function getActiveSession() { const { data } = await supa.auth.getSession(); return data.session || null; }

/* ── camelCase (app) ↔ snake_case (Postgres) mapping ──────────────────────
   Only top-level column names are converted; nested values (e.g. next_action's
   {text, dueDate}) are stored verbatim as jsonb. */
function toSnakeKey(s) { return s.replace(/[A-Z]/g, m => '_' + m.toLowerCase()); }
function toCamelKey(s) { return s.replace(/_([a-z])/g, (_, c) => c.toUpperCase()); }
function toRow(rec) { const o = {}; for (const k in rec) o[toSnakeKey(k)] = rec[k]; return o; }
function fromRow(row) { const o = {}; for (const k in row) o[toCamelKey(k)] = row[k]; return o; }

const now = () => new Date().toISOString();

function createRemoteStore() {
  let doc = { accounts: [], contacts: [], deals: [], interactions: [], learnings: [] };
  const listeners = new Set();
  let lastError = null;

  function notify() { for (const fn of listeners) fn(doc); }
  function coll(name) { if (!FACTORIES[name]) throw new Error('Unknown collection: ' + name); return doc[name]; }

  // Apply a realtime change from another client into our in-memory doc.
  function applyRemote(table, evt, row) {
    const list = doc[table];
    if (!list) return;
    if (evt === 'DELETE') {
      const i = list.findIndex(r => r.id === row.id);
      if (i >= 0) list.splice(i, 1);
      notify();
      return;
    }
    const rec = fromRow(row);
    const i = list.findIndex(r => r.id === rec.id);
    if (i >= 0) list[i] = rec; else list.push(rec);
    notify();
  }

  function startRealtime() {
    const channel = supa.channel('crm-changes');
    for (const table of TABLES) {
      channel.on('postgres_changes', { event: '*', schema: 'public', table }, payload => {
        applyRemote(table, payload.eventType, payload.new && payload.new.id ? payload.new : payload.old);
      });
    }
    channel.subscribe();
    return channel;
  }

  return {
    async load() {
      for (const table of TABLES) {
        const { data, error } = await supa.from(table).select('*').is('deleted_at', null);
        if (error) { lastError = error.message; throw error; }
        doc[table] = (data || []).map(fromRow);
      }
      startRealtime();
      notify();
    },

    list(name) { return coll(name).filter(r => !r.deletedAt); },
    get(name, id) { return coll(name).find(r => r.id === id && !r.deletedAt); },

    add(name, fields) {
      const rec = FACTORIES[name](fields, now());
      if (name === 'accounts' && sessionUser) rec.ownerId = sessionUser.id;
      coll(name).push(rec);
      notify();
      supa.from(name).insert(toRow(rec)).then(({ error }) => {
        if (error) { lastError = error.message; console.error('insert', name, error.message); }
      });
      return rec;
    },

    update(name, id, changes) {
      const rec = coll(name).find(r => r.id === id);
      if (!rec) throw new Error(`Record not found: ${name}/${id}`);
      Object.assign(rec, changes, { updatedAt: now() });
      notify();
      supa.from(name).update(toRow({ ...changes, updatedAt: rec.updatedAt })).eq('id', id).then(({ error }) => {
        if (error) { lastError = error.message; console.error('update', name, error.message); }
      });
      return rec;
    },

    remove(name, id) {
      const rec = coll(name).find(r => r.id === id);
      if (!rec) throw new Error(`Record not found: ${name}/${id}`);
      const stamp = now();
      rec.deletedAt = stamp; rec.updatedAt = stamp;
      notify();
      supa.from(name).update({ deleted_at: stamp, updated_at: stamp }).eq('id', id).then(({ error }) => {
        if (error) { lastError = error.message; console.error('remove', name, error.message); }
      });
    },

    subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    getPersistError() { return lastError; },
  };
}


/* ===== js/auth-gate.js ===== */
/* Magic-link sign-in screen (replaces the old passcode gate) and the signed-in
   user chip. Access is restricted to @stepo.ai in the database; this UI just
   collects the email and asks Supabase to send the link. */

function buildSignIn() {
  const email = el('input', { type: 'email', placeholder: 'you@stepo.ai', autocomplete: 'email', required: 'required' });
  const btn = el('button', { class: 'btn btn-accent', type: 'submit', text: 'Send sign-in link' });
  const msg = el('div', { class: 'signin-msg' });

  const form = el('form', { class: 'signin-form' }, [email, btn, msg]);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const addr = email.value.trim();
    if (!addr) return;
    btn.disabled = true;
    msg.className = 'signin-msg';
    msg.textContent = 'Sending…';
    const { error } = await sendMagicLink(addr);
    btn.disabled = false;
    if (error) {
      msg.className = 'signin-msg err';
      msg.textContent = error.message;
    } else {
      msg.className = 'signin-msg ok';
      msg.textContent = 'Check your email for a sign-in link.';
    }
  });

  return el('div', { class: 'signin', id: 'signin' }, [
    el('div', { class: 'signin-box' }, [
      el('div', { class: 'brand', style: 'font-size:32px' }, [
        document.createTextNode('STEPO'), el('span', { class: 'accent', text: 'CRM' }),
      ]),
      el('div', { class: 'muted', text: 'Sign in with your @stepo.ai email.' }),
      form,
    ]),
  ]);
}

function mountUserChip(session, onSignOut) {
  const right = document.querySelector('.topbar-right');

}

/* Module-scoped so close can always unbind, whichever path closed the drawer.
   Every overlay in this app shares #overlay-root, so a leaked Escape handler
   does not just accumulate — it clobbers whatever overlay is open later. */
let dealDrawerKeyHandler = null;

function closeDealDrawer() {
  if (dealDrawerKeyHandler) {
    window.removeEventListener('keydown', dealDrawerKeyHandler);
    dealDrawerKeyHandler = null;
  }
  const root = document.getElementById('overlay-root');
  if (root) clear(root);
}

registerOverlayCloser(closeDealDrawer);

function openDealDrawer(ctx, dealId) {
  const root = document.getElementById('overlay-root');
  const deal = ctx.store.get('deals', dealId);
  if (!root || !deal) return;

  closeAllOverlays();

  // Which stage vocabulary this deal uses depends on its track.
  const currentTrack = deal.track || 'pipeline';
  const stageOptions = currentTrack === 'pilot' ? PILOT_STAGES : STAGES;

  const name = el('input', { value: deal.name });
  const value = el('input', { type: 'number', value: String(deal.value) });
  const stage = el('select', {}, stageOptions.map(s =>
    el('option', { value: s.id, text: s.label, ...(s.id === deal.stage ? { selected: 'selected' } : {}) })));
  const probability = el('input', {
    type: 'number', min: '0', max: '100', placeholder: 'Stage default',
    value: deal.probability === null ? '' : String(Math.round(deal.probability * 100)),
  });
  const closeDate = el('input', { type: 'date', value: deal.expectedCloseDate || '' });

  // Primary contact: pick from this account's contacts, or "+ Add new…" to
  // create a contact on the fly and select it. The <select>'s own value is the
  // source of truth at save time.
  const accountContacts = ctx.store.list('contacts').filter(c => c.accountId === deal.accountId);
  const primaryContact = el('select', {}, [
    el('option', { value: '', text: '— none —', ...(deal.primaryContactId ? {} : { selected: 'selected' }) }),
    ...accountContacts.map(c => el('option', {
      value: c.id,
      text: c.name + (c.title ? ` — ${c.title}` : ''),
      ...(c.id === deal.primaryContactId ? { selected: 'selected' } : {}),
    })),
    el('option', { value: '__add__', text: '+ Add new…' }),
  ]);
  primaryContact.addEventListener('change', () => {
    if (primaryContact.value !== '__add__') return;
    const name = (prompt('New contact name') || '').trim();
    if (!name) { primaryContact.value = deal.primaryContactId || ''; return; }
    const created = ctx.store.add('contacts', { accountId: deal.accountId, name });
    // Reflect the new contact in the dropdown and select it. The store change
    // will re-render views underneath, but this drawer keeps its own state.
    const opt = el('option', { value: created.id, text: name, selected: 'selected' });
    primaryContact.insertBefore(opt, primaryContact.lastChild);
    primaryContact.value = created.id;
  });
  const actionText = el('input', {
    value: deal.nextAction ? deal.nextAction.text : '', placeholder: 'What happens next',
  });
  const actionDue = el('input', {
    type: 'date', value: deal.nextAction ? deal.nextAction.dueDate : todayStr(),
  });

  function save() {
    const changes = {
      name: name.value.trim() || deal.name,
      primaryContactId: (primaryContact.value && primaryContact.value !== '__add__')
        ? primaryContact.value : null,
      value: Number(value.value) || 0,
      probability: probability.value === '' ? null : Number(probability.value) / 100,
      expectedCloseDate: closeDate.value || null,
      nextAction: actionText.value.trim()
        ? { text: actionText.value.trim(), dueDate: actionDue.value || todayStr() }
        : null,
    };
    // Back-burner deals have no stage board; only pipeline/pilot carry a stage.
    if (currentTrack !== 'backburner') changes.stage = stage.value;
    if (currentTrack === 'pipeline') {
      const stageDef = stageById(stage.value);
      if (stageDef.isClosed && !deal.closedAt) changes.closedAt = new Date().toISOString();
      if (!stageDef.isClosed) changes.closedAt = null;
    }
    ctx.store.update('deals', deal.id, changes);
    closeDealDrawer();
  }

  const interactions = ctx.store.list('interactions')
    .filter(i => i.dealId === deal.id)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  // Track control: move this deal between the three boards. Picks a sensible
  // default stage when crossing into a board whose stage vocabulary differs.
  function moveTrack(track) {
    if (track === currentTrack) return;
    let nextStage = deal.stage;
    if (track === 'pipeline' && !STAGE_IDS.includes(nextStage)) nextStage = 'negotiation';
    if (track === 'pilot' && !PILOT_STAGE_IDS.includes(nextStage)) nextStage = 'kickoff';
    ctx.store.update('deals', deal.id, { track, stage: nextStage });
    closeDealDrawer();
  }
  const trackControl = el('div', { class: 'track-control' },
    [['pipeline', 'Pipeline'], ['pilot', 'Pilot'], ['backburner', 'Back burner']].map(
      ([id, label]) => el('button', {
        class: 'btn ' + (id === currentTrack ? 'btn-accent' : 'btn-ghost'),
        text: label, onClick: () => moveTrack(id),
      })));

  const account = ctx.store.get('accounts', deal.accountId);
  const learnings = ctx.store.list('learnings').filter(l => l.accountId === deal.accountId);
  const drawer = el('div', { class: 'drawer' }, [
    el('div', { class: 'section-head' }, [
      el('h2', { text: deal.name }),
      el('button', { class: 'btn btn-ghost', text: 'Close', style: 'margin-left:auto', onClick: closeDealDrawer }),
    ]),
    account
      ? el('div', { class: 'muted' }, [
          el('a', { href: `#/account/${account.id}`, text: account.name, onClick: closeDealDrawer }),
        ])
      : null,

    learnings.length
      ? el('div', { class: 'card learnings-reminder' }, [
          el('div', { class: 'muted', text: '💡 Remember before this meeting' }),
          ...learnings.map(l => el('div', { class: 'learning-text', text: '• ' + l.text })),
        ])
      : null,

    el('label', { text: 'Track' }), trackControl,
    el('label', { text: 'Deal name' }), name,
    el('label', { text: 'Primary contact' }), primaryContact,
    el('div', { class: 'field-row' }, [
      el('div', {}, [el('label', { text: 'Value (USD)' }), value]),
      currentTrack !== 'backburner'
        ? el('div', {}, [el('label', { text: 'Stage' }), stage])
        : null,
    ]),
    el('div', { class: 'field-row' }, [
      el('div', {}, [el('label', { text: 'Probability %' }), probability]),
      el('div', {}, [el('label', { text: 'Expected close' }), closeDate]),
    ]),
    currentTrack === 'pipeline'
      ? el('div', {
          class: 'muted',
          text: `Weighted now: ${Math.round(effectiveProbability(deal) * 100)}% of $${(deal.value || 0).toLocaleString('en-US')}`,
        })
      : null,

    el('label', { text: 'Next action' }), actionText,
    el('label', { text: 'Due' }), actionDue,

    el('div', { class: 'actions' }, [
      el('button', { class: 'btn btn-accent', text: 'Save', onClick: save }),
      el('button', {
        class: 'btn btn-ghost', text: 'Log activity',
        onClick: () => {
          closeDealDrawer();
          window.dispatchEvent(new CustomEvent('crm:quick-add', {
            detail: { accountId: deal.accountId, dealId: deal.id },
          }));
        },
      }),
      el('button', {
        class: 'btn btn-ghost btn-danger', text: 'Delete deal',
        onClick: () => {
          if (confirm(`Delete "${deal.name}"?`)) {
            ctx.store.remove('deals', deal.id);
            closeDealDrawer();
          }
        },
      }),
    ]),

    el('div', { class: 'section-head', style: 'margin-top:22px' }, [
      el('h2', { text: 'Activity' }),
      el('span', { class: 'count', text: String(interactions.length) }),
    ]),
    interactions.length
      ? el('div', { class: 'timeline' }, interactions.map(i =>
          el('div', { class: 'timeline-item' }, [
            el('div', { class: 'when', text: `${fmtDate(i.date)} · ${i.type}` }),
            el('div', { text: (i.type === 'email' && i.direction ? (i.direction === 'out' ? '↗ ' : '↘ ') : '') + i.summary }),
            i.source === 'calendar' ? el('span', { class: 'chip calendar', text: 'calendar' }) : null,
            i.notes ? el('details', { class: 'notes' }, [el('summary', { text: 'Notes' }), el('div', { class: 'notes-body', text: i.notes })]) : null,
          ])))
      : el('div', { class: 'empty', text: 'Nothing logged on this deal.' }),
  ]);

  const scrim = el('div', { class: 'scrim', onClick: closeDealDrawer });
  root.append(scrim, drawer);

  dealDrawerKeyHandler = e => { if (e.key === 'Escape') closeDealDrawer(); };
  window.addEventListener('keydown', dealDrawerKeyHandler);
}


/* ===== js/views/board.js ===== */

/* Auto-scroll while dragging a card near a screen edge. Native HTML5 drag does
   not scroll the window, so long columns become undroppable. We track the
   pointer via `dragover` (the only move-like event fired during a native drag)
   and nudge the window (vertical) and the board (horizontal) on a rAF loop. */
let dragScrollRAF = null;
const dragPointer = { x: 0, y: 0 };
function trackDragPointer(e) { dragPointer.x = e.clientX; dragPointer.y = e.clientY; }

function startDragScroll() {
  stopDragScroll();
  document.addEventListener('dragover', trackDragPointer);
  document.addEventListener('drop', stopDragScroll);
  document.addEventListener('dragend', stopDragScroll);
  const EDGE = 100, MAX = 24;
  function step() {
    const vh = window.innerHeight, y = dragPointer.y;
    if (y < EDGE) window.scrollBy(0, -Math.ceil(MAX * (EDGE - y) / EDGE));
    else if (y > vh - EDGE) window.scrollBy(0, Math.ceil(MAX * (y - (vh - EDGE)) / EDGE));
    const board = document.querySelector('.board');
    if (board && board.scrollWidth > board.clientWidth + 1) {
      const r = board.getBoundingClientRect(), x = dragPointer.x;
      if (x < r.left + EDGE) board.scrollLeft -= Math.ceil(MAX * (r.left + EDGE - x) / EDGE);
      else if (x > r.right - EDGE) board.scrollLeft += Math.ceil(MAX * (x - (r.right - EDGE)) / EDGE);
    }
    dragScrollRAF = requestAnimationFrame(step);
  }
  dragScrollRAF = requestAnimationFrame(step);
}

function stopDragScroll() {
  if (dragScrollRAF) { cancelAnimationFrame(dragScrollRAF); dragScrollRAF = null; }
  document.removeEventListener('dragover', trackDragPointer);
  document.removeEventListener('drop', stopDragScroll);
  document.removeEventListener('dragend', stopDragScroll);
}

function dealCard(ctx, deal, today) {
  const account = ctx.store.get('accounts', deal.accountId);
  const contact = deal.primaryContactId ? ctx.store.get('contacts', deal.primaryContactId) : null;
  const hasLearning = ctx.store.list('learnings').some(l => l.accountId === deal.accountId);
  const due = deal.nextAction ? deal.nextAction.dueDate : null;
  const bucket = dueBucket(due, today);

  const card = el('div', {
    class: 'deal-card', draggable: 'true',
    onClick: () => openDealDrawer(ctx, deal.id),
  }, [
    el('div', { class: 'name', text: (hasLearning ? '💡 ' : '') + deal.name }),
    contact ? el('div', { class: 'contact', text: '👤 ' + contact.name }) : null,
    el('div', { class: 'acct', text: account ? account.name : 'No account' }),
    el('div', { class: 'val', text: fmtMoney(deal.value) }),
    due
      ? el('div', {
          class: 'chip ' + (bucket === 'overdue' ? 'overdue' : bucket === 'today' ? 'today' : ''),
          text: fmtDate(due),
        })
      : null,
  ]);

  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', deal.id);
    e.dataTransfer.effectAllowed = 'move';
    startDragScroll();
  });
  card.addEventListener('dragend', stopDragScroll);
  return card;
}

/* A single kanban column. Dropping a card here moves that deal onto this
   column's `track` and `stage` — so dragging a card from the back-burner (or
   the pilot board) into a pipeline column reactivates it, not just re-stages
   it within one board. Close bookkeeping only applies to the pipeline track. */
function stageColumn(ctx, { stage, deals, today, track }) {
  const sum = deals.reduce((n, d) => n + (d.value || 0), 0);
  const col = el('div', { class: 'column' }, [
    el('div', { class: 'stage-head' }, [
      el('span', { text: stage.label }),
      el('span', { class: 'sum', text: fmtMoney(sum) }),
    ]),
    ...deals.map(d => dealCard(ctx, d, today)),
  ]);

  col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop-target'); });
  col.addEventListener('dragleave', () => col.classList.remove('drop-target'));
  col.addEventListener('drop', e => {
    e.preventDefault();
    col.classList.remove('drop-target');
    stopDragScroll();
    const id = e.dataTransfer.getData('text/plain');
    const deal = ctx.store.get('deals', id);
    if (!deal || (deal.track === track && deal.stage === stage.id)) return;

    const changes = { track, stage: stage.id };
    if (track === 'pipeline') {
      if (stage.isClosed) {
        changes.closedAt = new Date().toISOString();
        if (!stage.isWon) changes.closedReason = prompt('Why was this lost?') || '';
      } else {
        changes.closedAt = null;
      }
    }
    ctx.store.update('deals', id, changes);
  });

  return col;
}

function renderAccounts(root, ctx) {
  const accounts = ctx.store.list('accounts');
  const deals = ctx.store.list('deals');
  const filter = el('input', { placeholder: 'Filter accounts…' });
  const list = el('div', { class: 'card-grid' });

  function draw() {
    const q = filter.value.trim().toLowerCase();
    const shown = accounts
      .filter(a => !q || a.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.localeCompare(b.name));

    list.replaceChildren(...(shown.length
      ? shown.map(a => {
          const mine = deals.filter(d => d.accountId === a.id);
          return el('div', {
            class: 'row', onClick: () => ctx.route('account', a.id),
          }, [
            el('div', { class: 'grow' }, [
              el('strong', { text: a.name }),
              el('div', { class: 'muted', text: a.type }),
            ]),
            el('span', { class: 'chip', text: `${mine.length} deal${mine.length === 1 ? '' : 's'}` }),
            el('span', { class: 'chip', text: fmtMoney(openPipelineValue(mine)) }),
          ]);
        })
      : [el('div', { class: 'empty', text: 'No accounts yet.' })]));
  }

  filter.addEventListener('input', draw);
  draw();

  const form = el('div', { class: 'card', style: 'display:none; margin-bottom:16px' },
    [accountForm(ctx, null)]);

  root.append(
    el('div', { class: 'section-head' }, [
      el('h1', { text: 'Accounts' }),
      el('span', { class: 'count', text: String(accounts.length) }),
      el('button', {
        class: 'btn btn-accent', text: '+ Account',
        style: 'margin-left:auto',
        onClick: () => {
          form.style.display = form.style.display === 'none' ? 'block' : 'none';
        },
      }),
    ]),
    form, filter, el('div', { style: 'height:12px' }), list,
  );
}

    return;
  }

  const editor = el('div', { class: 'card', style: 'display:none; margin-bottom:16px' },
    [accountForm(ctx, account)]);

  const sentCount = ctx.store.list('interactions')
    .filter(i => i.accountId === account.id && i.type === 'sent').length;

  // account.notes goes through el()'s own array (which filters null/undefined/
  // false) rather than as a bare argument to root.append() below — a raw
  // `cond ? el(...) : null` handed straight to the native append() stringifies
  // to a visible "null" text node, since only el()'s children-array filters it.
  const notesBlock = account.notes
    ? [el('div', { class: 'card', style: 'margin-bottom:16px' }, [account.notes])]
    : [];

  root.append(
    el('div', { class: 'section-head' }, [
      el('h1', { text: account.name }),
      el('span', { class: 'chip', text: account.type }),
      safeHref(account.website)
        ? el('a', { href: safeHref(account.website), target: '_blank', rel: 'noopener', class: 'muted', text: account.website })
        : null,
      el('span', { class: 'chip', text: `${sentCount} sent` }),
      el('button', {
        class: 'btn', text: 'Edit', style: 'margin-left:auto',
        onClick: () => {
          editor.style.display = editor.style.display === 'none' ? 'block' : 'none';
        },
      }),
      el('button', {
        class: 'btn btn-accent', text: '+ Log',
        onClick: () => window.dispatchEvent(new CustomEvent('crm:quick-add', {
          detail: { accountId: account.id, dealId: null },
        })),
      }),
      el('button', {
        class: 'btn btn-ghost btn-danger', text: 'Delete',
        onClick: () => {
          if (!confirm(`Delete "${account.name}" and its contacts, deals, and history? This can't be undone.`)) return;
          // Cascade: remove the account's children first, then the account.
          for (const c of ctx.store.list('contacts').filter(x => x.accountId === account.id)) ctx.store.remove('contacts', c.id);
          for (const dl of ctx.store.list('deals').filter(x => x.accountId === account.id)) ctx.store.remove('deals', dl.id);
          for (const i of ctx.store.list('interactions').filter(x => x.accountId === account.id)) ctx.store.remove('interactions', i.id);
          ctx.store.remove('accounts', account.id);
          ctx.route('accounts');
        },
      }),
    ]),
    editor,
    ...notesBlock,
    el('div', { class: 'detail-cols' }, [
      el('div', {}, [dealBlock(ctx, account), learningBlock(ctx, account), contactBlock(ctx, account)]),
      el('div', {}, [timelineBlock(ctx, account)]),
    ]),
  );
}


/* ===== js/views/today.js ===== */

const BUCKET_TITLES = [
  ['overdue', 'Overdue'],
  ['today', 'Due today'],
  ['week', 'This week'],
];

function openLogFor(ctx, deal) {
  window.dispatchEvent(new CustomEvent('crm:quick-add', {
    detail: { accountId: deal.accountId, dealId: deal.id },
  }));
}

function dealRow(ctx, deal, bucket) {
  const account = ctx.store.get('accounts', deal.accountId);
  const stage = stageById(deal.stage);
  return el('div', { class: 'row' }, [
    el('div', { class: 'grow' }, [
      el('div', {}, [
        el('strong', { text: deal.name }),
        ' ',
        el('span', { class: 'muted', text: account ? account.name : 'No account' }),
      ]),
      el('div', { class: 'muted', text: deal.nextAction ? deal.nextAction.text : 'No next action' }),
    ]),
    el('span', { class: 'chip', text: stage ? stage.label : deal.stage }),
    el('span', { class: 'chip', text: fmtMoney(deal.value) }),
    deal.nextAction && deal.nextAction.dueDate
      ? el('span', {
          class: 'chip ' + (bucket === 'overdue' ? 'overdue' : bucket === 'today' ? 'today' : ''),
          text: fmtDate(deal.nextAction.dueDate),
        })
      : null,
    el('button', {
      class: 'btn', text: 'Log',
      onClick: () => openLogFor(ctx, deal),
    }),
    el('button', {
      class: 'btn btn-ghost', text: 'Snooze 7d',
      onClick: () => {
        const base = (deal.nextAction && deal.nextAction.dueDate) || todayStr();
        const [y, m, d] = base.split('-').map(Number);
        const next = new Date(Date.UTC(y, m - 1, d + 7)).toISOString().slice(0, 10);
        ctx.store.update('deals', deal.id, {
          nextAction: { text: deal.nextAction ? deal.nextAction.text : 'Follow up', dueDate: next },
        });
      },
    }),
    el('button', {
      class: 'btn btn-ghost', text: 'Open',
      onClick: () => ctx.route('account', deal.accountId),
    }),
  ]);
}

function section(title, rows) {
  return el('section', { class: 'section' }, [
    el('div', { class: 'section-head' }, [
      el('h2', { text: title }),
      el('span', { class: 'count', text: String(rows.length) }),
    ]),
    rows.length ? rows : el('div', { class: 'empty', text: 'Nothing here.' }),
  ]);
}

function renderToday(root, ctx) {
  const today = todayStr();
  const deals = ctx.store.list('deals');
  const interactions = ctx.store.list('interactions');

  const buckets = { overdue: [], today: [], week: [] };
  for (const deal of deals) {
    if ((deal.track || 'pipeline') === 'backburner') continue; // parked on purpose
    const stage = stageById(deal.stage);
    if (stage && stage.isClosed) continue;
    const due = deal.nextAction ? deal.nextAction.dueDate : null;
    const bucket = dueBucket(due, today);
    if (buckets[bucket]) buckets[bucket].push(deal);
  }
  for (const key of Object.keys(buckets)) {
    buckets[key].sort((a, b) => (a.nextAction.dueDate < b.nextAction.dueDate ? -1 : 1));
  }

  const cold = deals.filter(d =>
    (d.track || 'pipeline') !== 'backburner' && isGoingCold(d, interactions, today));

  const owed = repliesOwed(interactions, ctx.store.list('contacts'), ctx.store.list('accounts'));
  const owedRows = owed.map(o => el('div', { class: 'row' }, [
    el('div', { class: 'grow' }, [
      el('strong', { text: o.contact.name }),
      el('span', { class: 'muted', text: o.account ? ' · ' + o.account.name : '' }),
      el('div', { class: 'muted', text: 'They emailed you — ' + fmtDate(o.since) }),
    ]),
    el('span', { class: 'chip owe', text: 'Reply owed' }),
    o.account ? el('button', {
      class: 'btn btn-ghost', text: 'Open',
      onClick: () => ctx.route('account', o.account.id),
    }) : null,
  ]));

  root.append(
    el('h1', { text: 'Today' }),
    ...BUCKET_TITLES.map(([key, title]) =>
      section(title, buckets[key].map(d => dealRow(ctx, d, key)))),
    section('Replies owed', owedRows),
    section('Going cold — 21+ days quiet', cold.map(d => dealRow(ctx, d, 'none'))),
  );
}


/* ===== js/views/pipeline.js ===== */

function onTrack(deal, track) {
  return (deal.track || 'pipeline') === track;
}

/* Compact card for the back-burner strip: the person leads, with account and
   when they were last touched. Draggable so it can be pulled back onto the
   board (dropping it in a pipeline column reactivates the deal). */
function backBurnerCard(ctx, deal, lastTouch) {
  const account = ctx.store.get('accounts', deal.accountId);
  const contact = deal.primaryContactId ? ctx.store.get('contacts', deal.primaryContactId) : null;
  const last = lastTouch(deal);
  const card = el('div', {
    class: 'bb-card', draggable: 'true',
    onClick: () => openDealDrawer(ctx, deal.id),
  }, [
    el('div', { class: 'name', text: contact ? contact.name : deal.name }),
    el('div', { class: 'acct', text: account ? account.name : 'No account' }),
    el('div', { class: 'muted', text: last ? 'Last touch ' + fmtDate(last.slice(0, 10)) : 'No recent contact' }),
  ]);
  card.addEventListener('dragstart', e => {
    e.dataTransfer.setData('text/plain', deal.id);
    e.dataTransfer.effectAllowed = 'move';
    startDragScroll();
  });
  card.addEventListener('dragend', stopDragScroll);
  return card;
}

function backBurnerStrip(ctx, deals, lastTouch) {
  const cards = deals.map(d => backBurnerCard(ctx, d, lastTouch));
  const list = el('div', { class: 'bb-list' },
    cards.length ? cards : [el('div', { class: 'empty', text: 'Drag a card here to keep a relationship warm.' })]);

  const strip = el('div', { class: 'backburner' }, [
    el('div', { class: 'bb-head' }, [
      el('span', { text: '🔥 Back burner' }),
      el('span', { class: 'count', text: String(deals.length) }),
    ]),
    list,
  ]);

  strip.addEventListener('dragover', e => { e.preventDefault(); strip.classList.add('drop-target'); });
  strip.addEventListener('dragleave', () => strip.classList.remove('drop-target'));
  strip.addEventListener('drop', e => {
    e.preventDefault();
    strip.classList.remove('drop-target');
    stopDragScroll();
    const id = e.dataTransfer.getData('text/plain');
    const deal = ctx.store.get('deals', id);
    if (!deal || onTrack(deal, 'backburner')) return;
    ctx.store.update('deals', id, { track: 'backburner' });
  });
  return strip;
}

function renderPipeline(root, ctx) {
  stopDragScroll(); // clear any loop left over from a re-render mid-drag
  const today = todayStr();
  const allDeals = ctx.store.list('deals');
  const deals = allDeals.filter(d => onTrack(d, 'pipeline'));
  const backBurner = allDeals.filter(d => onTrack(d, 'backburner'));

  // Most recent interaction per account, for the back-burner "last touch".
  const lastByAcct = new Map();
  for (const i of ctx.store.list('interactions')) {
    if (i.deletedAt) continue;
    const cur = lastByAcct.get(i.accountId);
    if (!cur || i.date > cur) lastByAcct.set(i.accountId, i.date);
  }
  const lastTouch = deal => lastByAcct.get(deal.accountId) || null;

  root.append(
    el('h1', { text: 'Pipeline' }),
    el('div', { class: 'metrics' }, [
      el('div', {}, [
        el('div', { class: 'metric-label', text: 'Open pipeline' }),
        el('div', { class: 'metric-value', text: fmtMoney(openPipelineValue(deals)) }),
      ]),
      el('div', {}, [
        el('div', { class: 'metric-label', text: 'Weighted forecast' }),
        el('div', { class: 'metric-value', text: fmtMoney(weightedForecast(deals)) }),
      ]),
      el('div', {}, [
        el('div', { class: 'metric-label', text: 'Open deals' }),
        el('div', {
          class: 'metric-value',
          text: String(deals.filter(d => {
            const stage = stageById(d.stage);
            return stage && !stage.isClosed;
          }).length),
        }),
      ]),
    ]),
    el('div', { class: 'board' },
      STAGES.map(stage =>
        stageColumn(ctx, {
          stage, today, track: 'pipeline',
          deals: deals.filter(d => d.stage === stage.id),
        }))),
    backBurnerStrip(ctx, backBurner, lastTouch),
  );
}


/* ===== js/views/pilot.js ===== */

function renderPilot(root, ctx) {
  stopDragScroll(); // clear any loop left over from a re-render mid-drag
  const today = todayStr();
  const deals = ctx.store.list('deals').filter(d => d.track === 'pilot');
  const total = deals.reduce((n, d) => n + (d.value || 0), 0);

/* ===== js/views/learnings.js ===== */

/* The Learnings tab: the themes are the overarching learnings; each account's
   specific learnings roll up under the theme it's tagged with. Click a row to
   jump to that account. */
function renderLearnings(root, ctx) {
  const learnings = ctx.store.list('learnings');
  const acctName = new Map(ctx.store.list('accounts').map(a => [a.id, a.name]));

  root.append(
    el('h1', { text: 'Learnings' }),
    el('div', { class: 'muted', text: `${learnings.length} captured across ${new Set(learnings.map(l => l.accountId)).size} accounts` }),
  );

  for (const theme of LEARNING_THEMES) {
    const items = learnings.filter(l => l.theme === theme.id);
    if (!items.length && theme.id === 'other') continue; // hide an empty "Other"
    root.append(el('section', { class: 'section' }, [
      el('div', { class: 'section-head' }, [
        el('h2', { text: theme.label }),
        el('span', { class: 'count', text: String(items.length) }),
      ]),
      items.length
        ? el('div', {}, items.map(l => el('div', {
            class: 'row', onClick: () => ctx.route('account', l.accountId),
          }, [
            el('div', { class: 'grow' }, [
              el('strong', { text: acctName.get(l.accountId) || 'Unknown account' }),
              el('div', { class: 'learning-text', text: l.text }),
            ]),
          ])))
        : el('div', { class: 'empty', text: 'Nothing captured under this theme yet.' }),
    ]));
  }
}


/* ===== js/views/quick-add.js ===== */

/* Names are globally unique across src/js because the bundler flattens
   every module into one scope. Never a bare `open`/`close` here. */
let quickAddKeyHandler = null;

function closeQuickAdd() {
  if (quickAddKeyHandler) {
    window.removeEventListener('keydown', quickAddKeyHandler);
    quickAddKeyHandler = null;
  }
  clear(document.getElementById('overlay-root'));
}

function openQuickAdd(ctx, preset = {}) {
  const root = document.getElementById('overlay-root');
  closeAllOverlays();

  const accounts = ctx.store.list('accounts').sort((a, b) => a.name.localeCompare(b.name));
  const accountInput = el('input', {
    list: 'qa-accounts', placeholder: 'Account (type a new name to create it)',
    value: preset.accountId ? (ctx.store.get('accounts', preset.accountId) || {}).name || '' : '',
  });
  const datalist = el('datalist', { id: 'qa-accounts' },
    accounts.map(a => el('option', { value: a.name })));

  const type = el('select', {}, INTERACTION_TYPES.map(t =>
    el('option', { value: t, text: t })));
  const date = el('input', { type: 'date', value: todayStr() });
  const summary = el('textarea', { placeholder: 'What happened? What did you promise?' });
  const artifactName = el('input', { placeholder: 'Artifact name (e.g. StepoAI-Field.pdf)' });
  const artifactUrl = el('input', { placeholder: 'Link (optional)' });
  const artifactRow = el('div', { style: 'display:none' }, [
    el('label', { text: 'Artifact' }), artifactName, artifactUrl,
  ]);
  type.addEventListener('change', () => {
    artifactRow.style.display = type.value === 'sent' ? 'block' : 'none';
  });

  const dealSelect = el('select', {}, [el('option', { value: '', text: '— no specific deal —' })]);
  function refreshDeals() {
    // Same comparator as save() below. A case-only mismatch here would show an
    // empty deal list while save() still attached to the existing account.
    const typed = accountInput.value.trim().toLowerCase();
    const account = accounts.find(a => a.name.toLowerCase() === typed);
    const deals = account
      ? ctx.store.list('deals').filter(d => d.accountId === account.id)
      : [];
    dealSelect.replaceChildren(
      el('option', { value: '', text: '— no specific deal —' }),
      ...deals.map(d => el('option', {
        value: d.id, text: d.name,
        ...(d.id === preset.dealId ? { selected: 'selected' } : {}),
      })),
    );
  }
  accountInput.addEventListener('change', refreshDeals);
  refreshDeals();

  function save() {
    const typed = accountInput.value.trim();
    if (!typed) return;
    let account = accounts.find(a => a.name.toLowerCase() === typed.toLowerCase());
    if (!account) account = ctx.store.add('accounts', { name: typed });

    ctx.store.add('interactions', {
      accountId: account.id,
      dealId: dealSelect.value || null,
      date: date.value || todayStr(),
      type: type.value,
      summary: summary.value.trim(),
      artifactName: type.value === 'sent' ? artifactName.value.trim() : '',
      artifactUrl: type.value === 'sent' ? artifactUrl.value.trim() : '',
    });
    closeQuickAdd();
  }

  const modal = el('div', { class: 'modal' }, [
    el('div', { class: 'section-head' }, [
      el('h2', { text: 'Log activity' }),
      el('button', { class: 'btn btn-ghost', text: 'Close', style: 'margin-left:auto', onClick: closeQuickAdd }),
    ]),
    el('label', { text: 'Account' }), accountInput, datalist,
    el('label', { text: 'Deal' }), dealSelect,
    el('div', { class: 'field-row' }, [
      el('div', {}, [el('label', { text: 'Type' }), type]),
      el('div', {}, [el('label', { text: 'Date' }), date]),
    ]),
    el('label', { text: 'Summary' }), summary,
    artifactRow,
    el('div', { class: 'actions' }, [
      el('button', { class: 'btn btn-accent', text: 'Save', onClick: save }),
      el('button', { class: 'btn btn-ghost', text: 'Cancel', onClick: closeQuickAdd }),
    ]),
  ]);

  root.append(el('div', { class: 'scrim', onClick: closeQuickAdd }), modal);
  accountInput.focus();

  quickAddKeyHandler = e => {
    if (e.key === 'Escape') closeQuickAdd();
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) save();
  };
  window.addEventListener('keydown', quickAddKeyHandler);
}

registerOverlayCloser(closeQuickAdd);

function mountQuickAdd(ctx) {
  document.getElementById('quick-add-btn').addEventListener('click', () => openQuickAdd(ctx));
  window.addEventListener('crm:quick-add', e => openQuickAdd(ctx, e.detail || {}));
}


/* ===== js/views/search.js ===== */

let searchKeyHandler = null;

function closeSearch() {
  if (searchKeyHandler) {
    window.removeEventListener('keydown', searchKeyHandler);
    searchKeyHandler = null;
  }
  clear(document.getElementById('overlay-root'));
}

function collect(ctx, q) {
  const query = q.trim().toLowerCase();
  if (!query) return [];
  const hits = [];

  for (const a of ctx.store.list('accounts')) {
    if (a.name.toLowerCase().includes(query)) {
      hits.push({ group: 'Accounts', label: a.name, sub: a.type, go: () => ctx.route('account', a.id) });
    }
  }
  for (const c of ctx.store.list('contacts')) {
    if (`${c.name} ${c.email} ${c.title}`.toLowerCase().includes(query)) {
      const acct = ctx.store.get('accounts', c.accountId);
      hits.push({
        group: 'Contacts', label: c.name,
        sub: [c.title, acct && acct.name].filter(Boolean).join(' · '),
        go: () => ctx.route('account', c.accountId),
      });
    }
  }
  for (const d of ctx.store.list('deals')) {
    if (d.name.toLowerCase().includes(query)) {
      hits.push({
        group: 'Deals', label: d.name, sub: d.stage,
        go: () => ctx.route('account', d.accountId),
      });
    }
  }
  for (const i of ctx.store.list('interactions')) {
    if (`${i.summary} ${i.artifactName}`.toLowerCase().includes(query)) {
      const acct = ctx.store.get('accounts', i.accountId);
      hits.push({
        group: 'Activity', label: i.summary.slice(0, 80) || i.artifactName,
        sub: `${fmtDate(i.date)} · ${acct ? acct.name : ''}`,
        go: () => ctx.route('account', i.accountId),
      });
    }
  }
  return hits.slice(0, 40);
}

function openSearch(ctx) {
  const root = document.getElementById('overlay-root');
  closeAllOverlays();

  const input = el('input', { placeholder: 'Search accounts, contacts, deals, activity…' });
  const results = el('div', {});

  function draw() {
    const hits = collect(ctx, input.value);
    if (!hits.length) {
      results.replaceChildren(el('div', { class: 'empty', text: input.value ? 'No matches.' : 'Start typing.' }));
      return;
    }
    const nodes = [];
    let group = null;
    for (const hit of hits) {
      if (hit.group !== group) {
        group = hit.group;
        nodes.push(el('div', { class: 'metric-label', style: 'margin-top:12px', text: group }));
      }
      nodes.push(el('div', {
        class: 'row',
        onClick: () => { hit.go(); closeSearch(); },
      }, [
        el('div', { class: 'grow' }, [
          el('strong', { text: hit.label }),
          el('div', { class: 'muted', text: hit.sub }),
        ]),
      ]));
    }
    results.replaceChildren(...nodes);
  }

  input.addEventListener('input', draw);
  draw();

  const modal = el('div', { class: 'modal' }, [input, results]);
  root.append(el('div', { class: 'scrim', onClick: closeSearch }), modal);
  input.focus();

  searchKeyHandler = e => { if (e.key === 'Escape') closeSearch(); };
  window.addEventListener('keydown', searchKeyHandler);
}

registerOverlayCloser(closeSearch);

function mountSearch(ctx) {
  document.getElementById('search-btn').addEventListener('click', () => openSearch(ctx));
  window.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openSearch(ctx);
    }
  });
}


/* ===== js/app.js ===== */

const ROUTES = {
  today: renderToday,
  pipeline: renderPipeline,
  pilot: renderPilot,
  accounts: renderAccounts,
  account: renderAccountDetail,
  learnings: renderLearnings,
};

function boot() {
  const store = createRemoteStore();
  const ctx = { store, route };
  const viewRoot = document.getElementById('view-root');

  const signInEl = buildSignIn();
  document.body.appendChild(signInEl);

  let currentUid = null;   // the signed-in user whose data is loaded
  let mounted = false;     // global overlays mounted once

  function parseHash() {
    const raw = (location.hash || '#/today').slice(2);
    const [name, param] = raw.split('/');
    return { name: ROUTES[name] ? name : 'today', param: param || null };
  }

  function render() {
    if (!currentUid) return; // signed out: the sign-in overlay is showing
    const { name, param } = parseHash();
    clear(viewRoot);
    viewRoot.dataset.route = name;
    ROUTES[name](viewRoot, ctx, param);
    for (const a of document.querySelectorAll('.nav a')) {
      a.classList.toggle('active', a.dataset.route === name);
    }
  }

  function route(name, param) {
    location.hash = param ? `#/${name}/${param}` : `#/${name}`;
  }

  window.addEventListener('hashchange', render);
  store.subscribe(() => render());

  async function showApp(session) {
    setSessionUser(session.user);
    mountUserChip(session, doSignOut);
    signInEl.style.display = 'none';
    if (session.user.id !== currentUid) {
      currentUid = session.user.id;
      await store.load();
    }
    if (!mounted) { mountQuickAdd(ctx); mountSearch(ctx); mounted = true; }
    render();
  }

  function showSignIn() {
    currentUid = null;
    clearUserChip();
    clear(viewRoot);
    signInEl.style.display = 'grid';
  }

  async function doSignOut() { await signOutUser(); }

  // Supabase drives all transitions: the initial session, magic-link callback,
  // token refresh, and sign-out all arrive through onAuthChange.
  onAuthChange(session => { if (session) showApp(session); else showSignIn(); });
  getActiveSession().then(s => { if (s) showApp(s); else showSignIn(); });
}

boot();

})();
