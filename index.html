async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function unlock() {
  const html = new TextDecoder().decode(
    Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0)));
  document.open();
  document.write(html);
  document.close();
}

if (sessionStorage.getItem('stepoCrm.unlocked') === '1') {
  unlock();
} else {
  document.getElementById('pass').addEventListener('keydown', async e => {
    if (e.key !== 'Enter') return;
    if (await sha256(e.target.value) === HASH) {
      sessionStorage.setItem('stepoCrm.unlocked', '1');
      unlock();
    } else {
      document.getElementById('err').textContent = 'Nope.';
      e.target.value = '';
    }
  });
}
</script>
